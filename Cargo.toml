[workspace]
members = ["src/backend", "src/frontend", "src/shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenCode Chat Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebSocket & HTTP
tungstenite = "0.28"
tokio-tungstenite = "0.28"
warp = "0.3.7"
http = "1.0"
reqwest = { version = "0.13", features = ["json"] }

# Authentication & JWT
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.8.1", features = ["sqlite", "runtime-tokio", "chrono", "derive"], default-features = false }

# Password hashing
bcrypt = "0.18"

# Encoding
base64 = { version = "0.22", features = ["std"] }

# CLI parsing
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
rand = { version = "0.10", features = ["std", "thread_rng"] }
hex = "0.4"
subtle = "2.6"
unicode-normalization = "0.1"

# JSON Schema validation
jsonschema = "0.41"

# UI (Slint for frontend)
slint = "1.5"
